name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    # A standard runner: free in a public repository. Larger runners are billed.
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      # Reads the pnpm version from the packageManager field of package.json.
      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Install packages
        run: pnpm install --frozen-lockfile

      # One command per step, so a failing command fails its own step.
      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # rust-toolchain.toml selects the Rust toolchain; this prints which one runs.
      - name: Rust toolchain
        working-directory: src-tauri
        run: rustc --version

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --all-targets --all-features

      - name: Rust tests
        working-directory: src-tauri
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo test --all-features

      - name: Install the Playwright browser
        run: pnpm exec playwright install chromium

      - name: End-to-end tests on the mocked window
        run: pnpm e2e:mock
